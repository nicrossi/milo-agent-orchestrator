# Orchestrator + Caddy. GUI is deployed separately on DO App Platform (Static Site).
# Run from the repo root on the Droplet:
#   DROPLET_IP=<reserved-ip> docker compose -f deploy/docker-compose.yml up -d --build
services:
  orchestrator:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ./orchestrator.env
    volumes:
      # Service-account JSONs copied to the Droplet (not committed):
      #   deploy/secrets/firebase.json  -> /secrets/firebase.json   (Firebase Admin auth)
      #   deploy/secrets/gcp.json       -> /secrets/gcp.json        (Vertex AI / Gemini)
      - ./secrets:/secrets:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthcheck').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      DROPLET_IP: ${DROPLET_IP:?set DROPLET_IP to the Droplet reserved IP}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gui-build:/srv/gui:ro          # static CRA build (scp'd from your machine)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - orchestrator
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
